name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serializa deploys: evita que duas execuções recriem o container ao mesmo
# tempo (conflito de nome). Não cancela um deploy em andamento — enfileira.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/suporte/projetos/site-sobral
            echo "[1/4] sincronizando com origin/main..."
            git fetch origin
            # git pull aborta com "divergent branches" se a VPS tiver qualquer
            # commit local ou se o historico do remoto for reescrito. O alvo de
            # deploy deve ser um espelho de origin/main, entao sincronizamos por
            # reset. Alteracoes locais nao commitadas vao para o stash antes,
            # para nada ser descartado em silencio.
            if [ -n "$(git status --porcelain)" ]; then
              echo "AVISO: alteracoes locais nao commitadas encontradas:"
              git status --short
              git stash push --include-untracked -m "deploy-$(date +%Y%m%d-%H%M%S)"
              echo "AVISO: salvas em stash — recupere com 'git stash list'"
            fi
            git reset --hard origin/main
            git log --oneline -1
            echo "[2/4] docker compose up --build..."
            docker compose up --build -d
            echo "[3/4] migrations..."
            docker compose exec -T app node server/src/db/migrate.js || true
            echo "[4/4] Deploy concluído em $(date)"
